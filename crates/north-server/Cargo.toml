[package]
name = "north-server"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
north-domain = { path = "../north-domain" }
north-persistence = { path = "../north-persistence" }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
north-protocol = { path = "../north-protocol" }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }

[lints]
workspace = true
