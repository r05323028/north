[package]
name = "north-persistence"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
north-domain = { path = "../north-domain" }
rand = "0.9"
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
