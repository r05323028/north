---
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%

      rust:
        target: auto
        threshold: 1%
        flags:
          - rust

      web:
        target: auto
        threshold: 1%
        flags:
          - web

    patch:
      default:
        target: 80%

comment:
  layout: "diff, flags, files"
  behavior: default

flags:
  rust:
    paths:
      - crates/
      - tests/
    carryforward: true

  web:
    paths:
      - apps/web/
    carryforward: true
