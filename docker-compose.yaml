services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  north-server:
    image: "${NORTH_SERVER_IMAGE:?Set NORTH_SERVER_IMAGE}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the postgres service}"
      NORTH_OTP_HMAC_KEY: "${NORTH_OTP_HMAC_KEY:?Set NORTH_OTP_HMAC_KEY}"
      NORTH_BIND_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${NORTH_SERVER_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  north-web:
    image: "${NORTH_WEB_IMAGE:?Set NORTH_WEB_IMAGE}"
    ports:
      - "127.0.0.1:${NORTH_WEB_HOST_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
