[workspace]
resolver = "2"
members = [
    "crates/north-domain",
    "crates/north-protocol",
    "crates/north-persistence",
    "crates/north-server",
    "crates/north-daemon",
    "tests/architecture",
    "tests/transport",
    "tests/pre-push-postgres",
]

[workspace.dependencies]
sea-orm = { version = "2.0.3", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-time", "with-ipnetwork", "with-json"] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-time", "with-ipnetwork", "with-json"] }

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
