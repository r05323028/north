[workspace]
resolver = "2"
members = [
    "crates/north-domain",
    "crates/north-protocol",
    "crates/north-persistence",
    "crates/north-server",
    "crates/north-daemon",
    "tests/architecture",
    "tests/transport",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
