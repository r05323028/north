name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title (Conventional Commit)
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | ./scripts/check-commit-message.sh

  rust:
    name: Rust (fmt, clippy, unit+architecture)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: ./scripts/validate.sh rust

  rust-coverage:
    name: Rust coverage
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: cargo-llvm-cov
      - name: Generate Rust coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path rust-lcov.info
      # Codecov Action v7.0.0
      - name: Upload Rust coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust-lcov.info
          flags: rust
          name: rust
          disable_search: true
          fail_ci_if_error: true

  web-coverage:
    name: Web coverage
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Generate frontend coverage
        working-directory: apps/web
        run: npm run test:coverage
      # Codecov Action v7.0.0
      - name: Upload frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web
          name: web
          disable_search: true
          fail_ci_if_error: true

  daemon-integration:
    name: Daemon runtime integration
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: north
          POSTGRES_PASSWORD: north
          POSTGRES_DB: north
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U north -d north"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Run database-backed daemon integration
        env:
          NORTH_TEST_DATABASE_URL: postgres://north:north@127.0.0.1:5432/north
        run: ./scripts/validate.sh integration

  web:
    name: Web (lint, typecheck, build)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Run web validation
        working-directory: .
        run: ./scripts/validate.sh web

  openspec:
    name: OpenSpec validation
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # OpenSpec CLI is intentionally bootstrapped for this validation job.
      # zizmor: ignore[adhoc-packages]
      - run: npm install -g @fission-ai/openspec@1.9.0
      - run: ./scripts/validate.sh specs

  gate:
    name: merge gate
    needs:
      - pr-title
      - rust
      - rust-coverage
      - web
      - web-coverage
      - openspec
      - daemon-integration
    if: always() && !cancelled()
    runs-on: self-hosted
    steps:
      - name: Fail unless every required job succeeded
        run: |
          # pr-title is intentionally skipped on push events; every
          # actual validation job must succeed on every event.
          if [ "${{ needs.pr-title.result }}" != "success" ] &&
             ! { [ "${{ needs.pr-title.result }}" = "skipped" ] &&
                 [ "${{ github.event_name }}" = "push" ]; }; then
            echo "pr-title gate result: ${{ needs.pr-title.result }}"
            exit 1
          fi
          for job in \
            rust web openspec daemon-integration \
            rust-coverage web-coverage; do
            result="${{ needs.rust.result }}"
            [ "$job" = web ] && result="${{ needs.web.result }}"
            [ "$job" = openspec ] && result="${{ needs.openspec.result }}"
            if [ "$job" = daemon-integration ]; then
              result="${{ needs.daemon-integration.result }}"
            fi
            if [ "$job" = rust-coverage ]; then
              result="${{ needs.rust-coverage.result }}"
            fi
            if [ "$job" = web-coverage ]; then
              result="${{ needs.web-coverage.result }}"
            fi
            echo "$job: $result"
            [ "$result" = success ] || exit 1
          done
          echo 'gate: all required jobs succeeded'
